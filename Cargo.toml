[package]
name = "dirsync"
version = "1.1.4"
edition = "2024"
description = "One-way directory mirror sync with smart rename/move detection"
license = "GPL-3.0-only"

[[bin]]
name = "dirsync"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["axum", "rust-embed", "mime_guess", "open"]

[dependencies]
# Core
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
rayon = "1"
filetime = "0.2"
wildmatch = "2"
sha2 = "0.11"
dirs = "6"
# CLI
lexopt = "0.3"
indicatif = { version = "0.18", features = ["tokio"] }
chrono = "0.4"

# GUI (optional)
axum = { version = "0.8", features = ["ws", "macros"], optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
open = { version = "5", optional = true }

[lib]
name = "dirsync"
path = "src/lib.rs"

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
