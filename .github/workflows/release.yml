name: Release

# Changes that cannot alter either binary skip the whole workflow: including
# the rolling release, which would otherwise be torn down and republished with
# byte-identical artifacts. Docs are the obvious case; make.ps1 and make.sh
# qualify too, because they are local developer helpers and CI never invokes
# them (it calls cargo and npm directly). Only paths that can influence a build
# belong outside this list; when in doubt, leave a path out of it and let CI run.
#
# The two lists are duplicated on purpose: GitHub's workflow parser does not
# support YAML anchors, so they have to be kept in sync by hand.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
      - ".github/badges/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
      - ".github/badges/**"

env:
  CARGO_TERM_COLOR: always
  # SBOM generators are pinned so the output stays reproducible; bump deliberately.
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  CYCLONEDX_NPM_VERSION: "6.0.1"

jobs:
  # Concurrency is set per job rather than for the whole workflow. Each build
  # job cancels the same job of an older run on the same ref, so an older
  # push stops spending minutes on binaries that would never be published.
  # The release job has one group across all refs (workflow_dispatch can run
  # from any branch), so only the newest run publishes `rolling`: a slower
  # older run can no longer delete it and republish older binaries. Putting
  # this at the workflow level instead would also cancel an older release
  # job halfway between `gh release delete` and `gh release create`, leaving
  # no rolling release until the newer run's builds finished.
  build-windows:
    # Test and the compile checks (Build, Build CLI-only) run on every PR so a
    # Windows-only #[cfg(windows)] regression cannot hide behind a
    # Linux-only PR pipeline. Staging and the artifact upload are release
    # concerns and stay push/dispatch-only below.
    runs-on: windows-latest
    # Least privilege: these jobs only read the repository and upload
    # artifacts. Only the release job below needs contents: write.
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-build-windows-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      # The Windows-only code (case-only renames, drive detection,
      # normalize_path) is only exercised here: the Linux job cannot run it.
      # A debug build, not --release, so it does not rebuild with LTO; clippy
      # and fmt are platform-independent and stay in the Linux job.
      - name: Test
        run: cargo test --locked --all-features
      - name: Build
        run: cargo build --locked --release --features gui
      # Staged before the CLI-only build below, which reuses the same
      # target/release/dirsync.exe path and would otherwise overwrite it.
      - name: Stage GUI binary
        if: github.event_name != 'pull_request'
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/dirsync.exe dist/
      - name: Build CLI-only
        run: cargo build --locked --release --no-default-features
      - name: Stage CLI-only binary
        if: github.event_name != 'pull_request'
        run: Copy-Item target/release/dirsync.exe dist/dirsync-cli.exe
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: windows
          path: dist/
          retention-days: 7

  test-and-build-linux:
    runs-on: ubuntu-latest
    # Least privilege: these jobs only read the repository and upload
    # artifacts. Only the release job below needs contents: write.
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-build-linux-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Format check
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --locked --all-features --verbose
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # build.rs already ran npm ci and the Vite build during Test/Clippy
      # above (cargo invokes it whenever the gui feature is active, and
      # --all-features enables it), so node_modules and the generated
      # license file already exist here.
      - name: Type-check frontend
        run: npm run check
        working-directory: frontend
      # Everything below is skipped for pull requests: a PR just needs the
      # checks above. A manual workflow_dispatch run does build and release,
      # which is the point of having the manual trigger at all.
      - name: Install frontend deps
        if: github.event_name != 'pull_request'
        run: npm ci
        working-directory: frontend
      - name: Install musl tools
        if: github.event_name != 'pull_request'
        run: sudo apt-get install -y musl-tools
      - name: Add musl target
        if: github.event_name != 'pull_request'
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --features gui --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # Staged before the CLI-only build below, which reuses the same
      # target/.../release/dirsync path and would otherwise overwrite it.
      - name: Stage GUI binary
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/dirsync dist/
      - name: Build CLI-only
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: Stage CLI-only binary
        if: github.event_name != 'pull_request'
        run: cp target/x86_64-unknown-linux-musl/release/dirsync dist/dirsync-cli
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: linux
          path: dist/
          retention-days: 7

  # The SBOM generators are third-party code fetched at run time, so they run
  # in a job of their own that never has a release binary in its workspace:
  # nothing they execute can touch what gets published. All four Rust SBOMs
  # come from `cargo metadata --filter-platform`, which needs neither the
  # target's toolchain nor a build, so one Linux runner covers both targets.
  sbom:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-sbom-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Third-party action pinned to a full commit SHA: a tag can be moved to
      # point at different code, a commit SHA cannot. v2.87.5. It downloads
      # the prebuilt release and checks it against the SHA-256 recorded in
      # the action's manifest; `fallback: none` makes a missing manifest
      # entry fail the job instead of silently installing an unverified build.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8
        with:
          tool: cargo-cyclonedx@${{ env.CARGO_CYCLONEDX_VERSION }}
          fallback: none
      # Runtime dependency graphs for the shipped binaries. cargo-cyclonedx
      # resolves via `cargo metadata`, so dev-dependencies are excluded by
      # construction and `--no-build-deps` drops build-dependencies too.
      - name: Generate Windows SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --features gui
          --target x86_64-pc-windows-msvc
          --no-build-deps
          --override-filename sbom-x86_64-pc-windows-msvc
      # The CLI-only binary links 52 fewer crates (no axum, rust-embed,
      # mime_guess or open) and embeds no frontend, so neither the GUI
      # SBOM nor sbom-frontend.json describes it.
      - name: Generate Windows CLI-only SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --no-default-features
          --target x86_64-pc-windows-msvc
          --no-build-deps
          --override-filename sbom-cli-x86_64-pc-windows-msvc
      - name: Generate Linux SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --features gui
          --target x86_64-unknown-linux-musl
          --no-build-deps
          --override-filename sbom-x86_64-unknown-linux-musl
      - name: Generate Linux CLI-only SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --no-default-features
          --target x86_64-unknown-linux-musl
          --no-build-deps
          --override-filename sbom-cli-x86_64-unknown-linux-musl
      # cyclonedx-npm reads the installed tree. --ignore-scripts: nothing in
      # this job needs a package's install script to run.
      - name: Install frontend deps
        run: npm ci --ignore-scripts
        working-directory: frontend
      # The frontend declares everything as devDependencies, but Vite compiles
      # the Svelte runtime into the bundle that rust-embed ships inside the
      # binary: so these are recorded rather than omitted. npx pins the
      # generator's own version but resolves its dependencies at run time,
      # which is why this runs here and not next to the binaries.
      - name: Generate frontend SBOM
        working-directory: frontend
        run: >
          npx --yes @cyclonedx/cyclonedx-npm@${{ env.CYCLONEDX_NPM_VERSION }}
          --spec-version 1.6
          --output-format JSON
          --output-reproducible
          --output-file ../sbom-frontend.json
      - name: Stage SBOMs
        run: |
          mkdir -p sbom
          mv sbom-x86_64-pc-windows-msvc.json sbom-cli-x86_64-pc-windows-msvc.json sbom/
          mv sbom-x86_64-unknown-linux-musl.json sbom-cli-x86_64-unknown-linux-musl.json sbom/
          mv sbom-frontend.json sbom/
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  release:
    needs: [build-windows, test-and-build-linux, sbom]
    # build-windows and test-and-build-linux both run their compile checks
    # on pull requests too, so their success does not imply a push/dispatch
    # event: without this, a PR run would satisfy `needs` and this job would
    # try to overwrite the rolling release before merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One group for every ref: see the note at the top of `jobs`.
    concurrency:
      group: ${{ github.workflow }}-rolling-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: artifacts/
      - name: Publish rolling release
        # Third-party action pinned to a full commit SHA: a tag can be moved
        # to point at different code, a commit SHA cannot. v4.0.0.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            # The tag is created through the API (--cleanup-tag on delete,
            # --target on create), never by `git push`: GITHUB_TOKEN belongs
            # to a GitHub App, and pushing a ref whose tree carries
            # .github/workflows/ is rejected without a `workflows` scope that
            # the token cannot be granted. Deleting release and tag together
            # also stops a retry from finding a stale tag with no release.
            gh release delete rolling --yes --cleanup-tag || true
            cat > /tmp/release-notes.md <<'NOTES'
            Latest automated build from main.

            | OS | Linux | Windows |
            | --- | --- | --- |
            | GUI | [dirsync](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync) | [dirsync.exe](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync.exe) |
            | CLI | [dirsync-cli](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync-cli) | [dirsync-cli.exe](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync-cli.exe) |
            NOTES
            gh release create rolling \
              --target "$GITHUB_SHA" \
              --title "Rolling" \
              --latest \
              --notes-file /tmp/release-notes.md \
              artifacts/dirsync.exe \
              artifacts/dirsync \
              artifacts/dirsync-cli.exe \
              artifacts/dirsync-cli \
              artifacts/sbom-x86_64-pc-windows-msvc.json \
              artifacts/sbom-cli-x86_64-pc-windows-msvc.json \
              artifacts/sbom-x86_64-unknown-linux-musl.json \
              artifacts/sbom-cli-x86_64-unknown-linux-musl.json \
              artifacts/sbom-frontend.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
