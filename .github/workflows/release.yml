name: Release

# Changes that cannot alter either binary skip the whole workflow: including
# the rolling release, which would otherwise be torn down and republished with
# byte-identical artifacts. Docs are the obvious case; make.ps1 and make.sh
# qualify too, because they are local developer helpers and CI never invokes
# them (it calls cargo and npm directly). Only paths that can influence a build
# belong outside this list; when in doubt, leave a path out of it and let CI run.
#
# The two lists are duplicated on purpose: GitHub's workflow parser does not
# support YAML anchors, so they have to be kept in sync by hand.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
      - ".github/badges/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
      - ".github/badges/**"

env:
  CARGO_TERM_COLOR: always
  # SBOM generators are pinned so the output stays reproducible; bump deliberately.
  # The SHA-256 is that of the x86_64-unknown-linux-musl release tarball and
  # changes with every version: take it from the release's .sha256 asset.
  CARGO_CYCLONEDX_VERSION: "0.5.10"
  CARGO_CYCLONEDX_SHA256: "528be9dd99ae522c3ee14fb881fd0cbf51767e8f12b74248f437e6a66b1a3c1b"
  CYCLONEDX_NPM_VERSION: "7.0.1"
  CYCLONEDX_SPEC_VERSION: "1.7"

jobs:
  # Concurrency is set per job rather than for the whole workflow. Each build
  # job cancels the same job of an older run on the same ref, so an older
  # push stops spending minutes on binaries that would never be published.
  # The release job has one group across all refs, so only the newest run
  # publishes `rolling`: a slower older run can no longer delete it and
  # republish older binaries. Putting
  # this at the workflow level instead would also cancel an older release
  # job halfway through swapping its draft in for the published release,
  # leaving no rolling release until the newer run's builds finished.
  build-windows:
    # Test and the compile checks (Build, Build CLI-only) run on every PR so a
    # Windows-only #[cfg(windows)] regression cannot hide behind a
    # Linux-only PR pipeline. Staging and the artifact upload are release
    # concerns and stay push/dispatch-only below.
    runs-on: windows-latest
    # Least privilege: these jobs only read the repository and upload
    # artifacts. Only the release job below needs contents: write.
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-build-windows-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      # The Windows-only code (case-only renames, drive detection,
      # normalize_path) is only exercised here: the Linux job cannot run it.
      # A debug build, not --release, so it does not rebuild with LTO; clippy
      # and fmt are platform-independent and stay in the Linux job.
      - name: Test
        run: cargo test --locked --all-features
      - name: Build
        run: cargo build --locked --release --features gui
      # Staged before the CLI-only build below, which reuses the same
      # target/release/dirsync.exe path and would otherwise overwrite it.
      - name: Stage GUI binary
        if: github.event_name != 'pull_request'
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/dirsync.exe dist/
      - name: Build CLI-only
        run: cargo build --locked --release --no-default-features
      - name: Stage CLI-only binary
        if: github.event_name != 'pull_request'
        run: Copy-Item target/release/dirsync.exe dist/dirsync-cli.exe
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: windows
          path: dist/
          retention-days: 7

  test-and-build-linux:
    runs-on: ubuntu-latest
    # Least privilege: these jobs only read the repository and upload
    # artifacts. Only the release job below needs contents: write.
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-build-linux-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Format check
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --locked --all-features --verbose
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # build.rs already ran npm ci and the Vite build during Test/Clippy
      # above (cargo invokes it whenever the gui feature is active, and
      # --all-features enables it), so node_modules and the generated
      # license file already exist here.
      - name: Type-check frontend
        run: npm run check
        working-directory: frontend
      # Everything below is skipped for pull requests: a PR just needs the
      # checks above. A manual workflow_dispatch run does build and release,
      # which is the point of having the manual trigger at all.
      - name: Install frontend deps
        if: github.event_name != 'pull_request'
        run: npm ci
        working-directory: frontend
      - name: Install musl tools
        if: github.event_name != 'pull_request'
        run: sudo apt-get install -y musl-tools
      - name: Add musl target
        if: github.event_name != 'pull_request'
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --features gui --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # Staged before the CLI-only build below, which reuses the same
      # target/.../release/dirsync path and would otherwise overwrite it.
      - name: Stage GUI binary
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/dirsync dist/
      - name: Build CLI-only
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: Stage CLI-only binary
        if: github.event_name != 'pull_request'
        run: cp target/x86_64-unknown-linux-musl/release/dirsync dist/dirsync-cli
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: linux
          path: dist/
          retention-days: 7

  # The SBOM generators are third-party code fetched at run time, so they run
  # in a job of their own that never has a release binary in its workspace:
  # nothing they execute can touch what gets published. All four Rust SBOMs
  # come from `cargo metadata --filter-platform`, which needs neither the
  # target's toolchain nor a build, so one Linux runner covers both targets.
  sbom:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-sbom-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      # The prebuilt release, checked against the SHA-256 pinned above before
      # anything from it runs: a mismatch fails the job. (taiki-e/install-action
      # does the same from its own manifest, but that lags new releases.)
      - name: Install cargo-cyclonedx
        run: |
          name="cargo-cyclonedx-x86_64-unknown-linux-musl"
          url="https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/${name}.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/${name}.tar.xz" "$url"
          echo "${CARGO_CYCLONEDX_SHA256}  $RUNNER_TEMP/${name}.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/${name}.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-cyclonedx" "$HOME/.cargo/bin/cargo-cyclonedx"
          cargo cyclonedx --version
      # Runtime dependency graphs for the shipped binaries. cargo-cyclonedx
      # resolves via `cargo metadata`, so dev-dependencies are excluded by
      # construction and `--no-build-deps` drops build-dependencies too.
      - name: Generate Windows SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version ${{ env.CYCLONEDX_SPEC_VERSION }}
          --features gui
          --target x86_64-pc-windows-msvc
          --no-build-deps
          --override-filename sbom-x86_64-pc-windows-msvc
      # The CLI-only binary links 52 fewer crates (no axum, rust-embed,
      # mime_guess or open) and embeds no frontend, so neither the GUI
      # SBOM nor sbom-frontend.json describes it.
      - name: Generate Windows CLI-only SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version ${{ env.CYCLONEDX_SPEC_VERSION }}
          --no-default-features
          --target x86_64-pc-windows-msvc
          --no-build-deps
          --override-filename sbom-cli-x86_64-pc-windows-msvc
      - name: Generate Linux SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version ${{ env.CYCLONEDX_SPEC_VERSION }}
          --features gui
          --target x86_64-unknown-linux-musl
          --no-build-deps
          --override-filename sbom-x86_64-unknown-linux-musl
      - name: Generate Linux CLI-only SBOM
        run: >
          cargo cyclonedx
          --format json
          --spec-version ${{ env.CYCLONEDX_SPEC_VERSION }}
          --no-default-features
          --target x86_64-unknown-linux-musl
          --no-build-deps
          --override-filename sbom-cli-x86_64-unknown-linux-musl
      # cyclonedx-npm reads the installed tree. --ignore-scripts: nothing in
      # this job needs a package's install script to run.
      - name: Install frontend deps
        run: npm ci --ignore-scripts
        working-directory: frontend
      # The frontend declares everything as devDependencies, but Vite compiles
      # the Svelte runtime into the bundle that rust-embed ships inside the
      # binary: so these are recorded rather than omitted. npx pins the
      # generator's own version but resolves its dependencies at run time,
      # which is why this runs here and not next to the binaries. Since 7.0
      # the JSON schema validator is an optional peer the generator no longer
      # pulls in itself: the ajv packages bring it back, and --validate makes
      # a missing validator or an invalid BOM fail the step.
      - name: Generate frontend SBOM
        working-directory: frontend
        run: >
          npx --yes
          --package @cyclonedx/cyclonedx-npm@${{ env.CYCLONEDX_NPM_VERSION }}
          --package ajv@8
          --package ajv-formats@3
          --package ajv-formats-draft2019@1
          -- cyclonedx-npm
          --spec-version ${{ env.CYCLONEDX_SPEC_VERSION }}
          --validate
          --output-format JSON
          --output-reproducible
          --output-file ../sbom-frontend.json
      - name: Stage SBOMs
        run: |
          mkdir -p sbom
          mv sbom-x86_64-pc-windows-msvc.json sbom-cli-x86_64-pc-windows-msvc.json sbom/
          mv sbom-x86_64-unknown-linux-musl.json sbom-cli-x86_64-unknown-linux-musl.json sbom/
          mv sbom-frontend.json sbom/
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  release:
    needs: [build-windows, test-and-build-linux, sbom]
    # build-windows and test-and-build-linux both run their compile checks
    # on pull requests too, so their success does not imply a push/dispatch
    # event: without this, a PR run would satisfy `needs` and this job would
    # try to overwrite the rolling release before merge. Only main publishes:
    # a manual dispatch from another branch builds and tests that branch but
    # never replaces `rolling` with code that is not on main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations: a short-lived OIDC token to sign them,
      # and the right to store them with the repository.
      id-token: write
      attestations: write
    # One group for every ref: see the note at the top of `jobs`.
    concurrency:
      group: ${{ github.workflow }}-rolling-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: artifacts/
      # The binaries are not code-signed. Checksums let a download be compared
      # with what this run published, and the attestation ties each binary to
      # this repository, this workflow and this commit:
      # `gh attestation verify <file> -R <owner>/<repo>`.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum dirsync dirsync.exe dirsync-cli dirsync-cli.exe sbom-*.json > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/dirsync
            artifacts/dirsync.exe
            artifacts/dirsync-cli
            artifacts/dirsync-cli.exe
      - name: Publish rolling release
        # Third-party action pinned to a full commit SHA: a tag can be moved
        # to point at different code, a commit SHA cannot. v4.0.0.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            # The action runs this through plain `bash -c`: without -e, only
            # the last command's status would decide whether an attempt failed.
            set -euo pipefail
            # The new release is built as a draft and swapped in only once
            # every asset is up, so a failed upload leaves the previous
            # release published instead of none. A draft creates no tag, so
            # until the swap it carries a placeholder tag name of its own.
            draft="rolling-draft-$GITHUB_RUN_ID"
            # Drafts left by a failed attempt or a cancelled run were never
            # published: drop them so every attempt starts clean.
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft and (.tag_name | startswith("rolling"))) | .id' |
              while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done
            cat > /tmp/release-notes.md <<'NOTES'
            Latest automated build from main.

            | OS | Linux | Windows |
            | --- | --- | --- |
            | GUI | [dirsync](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync) | [dirsync.exe](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync.exe) |
            | CLI | [dirsync-cli](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync-cli) | [dirsync-cli.exe](https://github.com/AEAD1337/dirsync/releases/download/rolling/dirsync-cli.exe) |

            Verify a download: `sha256sum -c SHA256SUMS --ignore-missing` compares it with this release's checksums, and `gh attestation verify <file> -R AEAD1337/dirsync` checks that this repository's release workflow built it.
            NOTES
            gh release create "$draft" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Rolling" \
              --notes-file /tmp/release-notes.md \
              artifacts/dirsync.exe \
              artifacts/dirsync \
              artifacts/dirsync-cli.exe \
              artifacts/dirsync-cli \
              artifacts/sbom-x86_64-pc-windows-msvc.json \
              artifacts/sbom-cli-x86_64-pc-windows-msvc.json \
              artifacts/sbom-x86_64-unknown-linux-musl.json \
              artifacts/sbom-cli-x86_64-unknown-linux-musl.json \
              artifacts/sbom-frontend.json               artifacts/SHA256SUMS
            release="repos/$GITHUB_REPOSITORY/releases/$(gh release view "$draft" --json databaseId --jq .databaseId)"
            # The swap. The tag is created through the API (--cleanup-tag on
            # delete, publishing the draft), never by `git push`: GITHUB_TOKEN
            # belongs to a GitHub App, and pushing a ref whose tree carries
            # .github/workflows/ is rejected without a `workflows` scope that
            # the token cannot be granted. The old tag has to go first: an
            # existing tag would pin the new release to the old commit.
            if gh release view rolling > /dev/null 2>&1; then
              gh release delete rolling --yes --cleanup-tag
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/rolling" > /dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/rolling"
            fi
            gh release edit "$draft" \
              --tag rolling \
              --target "$GITHUB_SHA" \
              --draft=false \
              --latest
            # Deleting a tag turns a release carrying that tag name back into
            # a draft, and GitHub does it asynchronously: it can land after
            # the publish above and unpublish the new release. Keep checking,
            # and publish again, until it has stayed up for 20 s. The tag now
            # exists at the right commit, so republishing keeps it.
            stable=0
            for _ in $(seq 24); do
              sleep 5
              if [ "$(gh api "$release" --jq .draft)" = "true" ]; then
                echo "Release fell back to a draft; publishing it again."
                gh api -X PATCH "$release" -F draft=false -f make_latest=true > /dev/null
                stable=0
              elif [ $((++stable)) -ge 4 ]; then
                break
              fi
            done
            [ "$stable" -ge 4 ]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
