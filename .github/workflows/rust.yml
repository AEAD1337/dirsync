name: Release

# Changes that cannot alter either binary skip the whole workflow: including
# the rolling release, which would otherwise be torn down and republished with
# byte-identical artifacts. Docs are the obvious case; make.ps1 and make.sh
# qualify too, because they are local developer helpers and CI never invokes
# them (it calls cargo and npm directly). Only paths that can influence a build
# belong outside this list; when in doubt, leave a path out of it and let CI run.
#
# The two lists are duplicated on purpose: GitHub's workflow parser does not
# support YAML anchors, so they have to be kept in sync by hand.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"

env:
  CARGO_TERM_COLOR: always
  # SBOM generators are pinned so the output stays reproducible; bump deliberately.
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  CYCLONEDX_NPM_VERSION: "6.0.1"

jobs:
  build-windows:
    # The compile checks (Build, Build CLI-only) run on every PR so a
    # Windows-only #[cfg(windows)] regression cannot hide behind a
    # Linux-only PR pipeline. SBOM generation, staging, and the artifact
    # upload are release concerns and stay push/dispatch-only below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build
        run: cargo build --release --features gui
      # Staged before the CLI-only build below, which reuses the same
      # target/release/dirsync.exe path and would otherwise overwrite it.
      - name: Stage GUI binary
        if: github.event_name != 'pull_request'
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/dirsync.exe dist/
      - name: Build CLI-only
        run: cargo build --release --no-default-features
      - name: Stage CLI-only binary
        if: github.event_name != 'pull_request'
        run: Copy-Item target/release/dirsync.exe dist/dirsync-cli.exe
      - name: Install cargo-cyclonedx
        if: github.event_name != 'pull_request'
        run: irm https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${{ env.CARGO_CYCLONEDX_VERSION }}/cargo-cyclonedx-installer.ps1 | iex
      # Runtime dependency graph for the shipped Windows binary. cargo-cyclonedx
      # resolves via `cargo metadata`, so dev-dependencies are excluded by
      # construction and `--no-build-deps` drops build-dependencies too.
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --features gui
          --target x86_64-pc-windows-msvc
          --no-build-deps
          --override-filename sbom-x86_64-pc-windows-msvc
      # The CLI-only binary links 52 fewer crates (no axum, rust-embed,
      # mime_guess or open), so the GUI SBOM would overstate it.
      - name: Generate CLI-only SBOM
        if: github.event_name != 'pull_request'
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --no-default-features
          --target x86_64-pc-windows-msvc
          --no-build-deps
          --override-filename sbom-cli-x86_64-pc-windows-msvc
      - name: Stage SBOMs
        if: github.event_name != 'pull_request'
        run: |
          Copy-Item sbom-x86_64-pc-windows-msvc.json dist/
          Copy-Item sbom-cli-x86_64-pc-windows-msvc.json dist/
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: windows
          path: dist/
          retention-days: 7

  test-and-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Format check
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --all-features --verbose
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # build.rs already ran npm ci and the Vite build during Test/Clippy
      # above (cargo invokes it whenever the gui feature is active, and
      # --all-features enables it), so node_modules and the generated
      # license file already exist here.
      - name: Type-check frontend
        run: npm run check
        working-directory: frontend
      # Everything below is skipped for pull requests: a PR just needs the
      # checks above. A manual workflow_dispatch run does build and release,
      # which is the point of having the manual trigger at all.
      - name: Install frontend deps
        if: github.event_name != 'pull_request'
        run: npm ci
        working-directory: frontend
      - name: Install musl tools
        if: github.event_name != 'pull_request'
        run: sudo apt-get install -y musl-tools
      - name: Add musl target
        if: github.event_name != 'pull_request'
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build
        if: github.event_name != 'pull_request'
        run: cargo build --release --features gui --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # Staged before the CLI-only build below, which reuses the same
      # target/.../release/dirsync path and would otherwise overwrite it.
      - name: Stage GUI binary
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/dirsync dist/
      - name: Build CLI-only
        if: github.event_name != 'pull_request'
        run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - name: Stage CLI-only binary
        if: github.event_name != 'pull_request'
        run: cp target/x86_64-unknown-linux-musl/release/dirsync dist/dirsync-cli
      - name: Install cargo-cyclonedx
        if: github.event_name != 'pull_request'
        run: curl --proto '=https' --tlsv1.3 -LsSf https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${{ env.CARGO_CYCLONEDX_VERSION }}/cargo-cyclonedx-installer.sh | sh
      # Runtime dependency graph for the shipped Linux/musl binary.
      - name: Generate Rust SBOM
        if: github.event_name != 'pull_request'
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --features gui
          --target x86_64-unknown-linux-musl
          --no-build-deps
          --override-filename sbom-x86_64-unknown-linux-musl
      # The frontend declares everything as devDependencies, but Vite compiles
      # the Svelte runtime into the bundle that rust-embed ships inside the
      # binary: so these are recorded rather than omitted.
      - name: Generate frontend SBOM
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: >
          npx --yes @cyclonedx/cyclonedx-npm@${{ env.CYCLONEDX_NPM_VERSION }}
          --spec-version 1.6
          --output-format JSON
          --output-reproducible
          --output-file ../sbom-frontend.json
      # The CLI-only binary links 52 fewer crates (no axum, rust-embed,
      # mime_guess or open) and embeds no frontend, so neither the GUI
      # SBOM nor sbom-frontend.json describes it.
      - name: Generate CLI-only SBOM
        if: github.event_name != 'pull_request'
        run: >
          cargo cyclonedx
          --format json
          --spec-version 1.5
          --no-default-features
          --target x86_64-unknown-linux-musl
          --no-build-deps
          --override-filename sbom-cli-x86_64-unknown-linux-musl
      - name: Stage SBOMs
        if: github.event_name != 'pull_request'
        run: |
          cp sbom-x86_64-unknown-linux-musl.json sbom-frontend.json dist/
          cp sbom-cli-x86_64-unknown-linux-musl.json dist/
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: linux
          path: dist/
          retention-days: 7

  release:
    needs: [build-windows, test-and-build-linux]
    # build-windows and test-and-build-linux both now run their compile
    # checks on pull requests too, so their success no longer implies a
    # push/dispatch event: without this, a PR run would satisfy `needs` and
    # this job would try to overwrite the rolling release before merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: artifacts/
      - name: Publish rolling release
        # Third-party action pinned to a full commit SHA: a tag can be moved
        # to point at different code, a commit SHA cannot. v4.0.0.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            gh release delete rolling --yes || true
            git push origin --delete rolling || true
            git tag -f rolling
            git push origin rolling --force
            gh release create rolling \
              --title "Rolling" \
              --latest \
              --notes "Latest automated build from main." \
              artifacts/dirsync.exe \
              artifacts/dirsync \
              artifacts/dirsync-cli.exe \
              artifacts/dirsync-cli \
              artifacts/sbom-x86_64-pc-windows-msvc.json \
              artifacts/sbom-cli-x86_64-pc-windows-msvc.json \
              artifacts/sbom-x86_64-unknown-linux-musl.json \
              artifacts/sbom-cli-x86_64-unknown-linux-musl.json \
              artifacts/sbom-frontend.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
