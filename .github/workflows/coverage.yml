name: Coverage

# Same paths-ignore lists as release.yml: a change that cannot alter the code
# under test cannot alter coverage either. The lists are duplicated by hand
# because GitHub's workflow parser does not support YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
      - ".github/badges/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reviews/**"
      - "LICENSE"
      - ".gitignore"
      - "make.ps1"
      - "make.sh"
      - ".github/badges/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs the code under test, which on a pull request is the PR's code: so it
  # gets the workflow's read-only token and no persisted checkout
  # credentials. Writing the badge back to main is the separate job below.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview
      # Third-party action pinned to a full commit SHA: a tag can be moved to
      # point at different code, a commit SHA cannot. v2.90.6.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-llvm-cov
      # CLI-only, matching `make.ps1 coverage`: the gui modules are axum wiring
      # and WebSocket plumbing with no test harness, so including them only
      # dilutes the number for the code the tests actually exercise. It also
      # keeps Node out of this job, since build.rs skips Vite without the gui
      # feature.
      - name: Collect coverage
        run: cargo llvm-cov --locked --no-default-features --summary-only --json --output-path coverage-summary.json
      - name: Report
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent' coverage-summary.json)
          printf 'CLI line coverage: %.2f%%\n' "$pct" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.data[0].totals | "functions: \(.functions.percent | floor)%, regions: \(.regions.percent | floor)%"' coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: coverage-summary
          path: coverage-summary.json
          retention-days: 1

  # The badge is served by shields.io's endpoint API from a JSON file
  # committed to main: no third-party coverage service, no upload token,
  # and no extra branch. `.github/badges/**` is in every paths-ignore list
  # in this repository (Audit uses an allowlist and never matches it), so
  # the commit made here cannot trigger another CI run. This is the only job
  # with write access, it never runs for a pull request, and it executes no
  # repository code: it reads the summary the coverage job produced.
  badge:
    needs: coverage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Needed to commit the badge payload back to main.
      contents: write
    steps:
      # No credentials in the checkout: the token is handed to the pull and
      # push at the end and to nothing else in this job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Outside the work tree: an artifact unpacked into the checkout could
      # carry files (a .git/config, a hook) that the git commands below would
      # pick up.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/coverage
      - name: Publish badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent | floor' "$RUNNER_TEMP/coverage/coverage-summary.json")
          # Only a whole number from 0 to 100 reaches the badge and the commit.
          case "$pct" in
            ''|*[!0-9]*) echo "::error::unexpected coverage value"; exit 1 ;;
          esac
          if [ "$pct" -gt 100 ]; then echo "::error::unexpected coverage value"; exit 1; fi
          if   [ "$pct" -ge 80 ]; then color=brightgreen
          elif [ "$pct" -ge 70 ]; then color=green
          elif [ "$pct" -ge 50 ]; then color=yellow
          else color=red; fi
          mkdir -p .github/badges
          payload='{schemaVersion: 1, label: "Coverage", message: $m, color: $c}'
          jq -n --arg m "$pct%" --arg c "$color" "$payload" > .github/badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare against the index: a plain `git diff` on
          # an untracked file reports no change, which would skip the very
          # first publish. Most pushes leave the rounded percentage untouched,
          # and committing only when it moves keeps main free of badge noise.
          git add .github/badges/coverage.json
          if git diff --cached --quiet -- .github/badges/coverage.json; then
            echo "Coverage still $pct%, badge unchanged"
            exit 0
          fi
          git commit -m "coverage badge: $pct%"
          # The token reaches git through the environment, as an HTTP header
          # the way actions/checkout passes it: never in argv or .git/config.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # Another push can land while the tests run, which would reject a
          # plain push: rebase onto whatever main is now and try again.
          git pull --rebase origin main
          git push origin HEAD:main
